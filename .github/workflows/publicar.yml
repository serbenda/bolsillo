name: Actualizar datos y publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Horas en UTC. El PVPC de mañana se publica hacia las 20:15 (hora peninsular);
    # los carburantes se actualizan varias veces al día.
    - cron: '7 0,6,12,19,20,21 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por commit (v4, v5…) para que no cambien sin que lo sepamos
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Recuperar los datos publicados (por si alguna fuente falla ahora)
        env:
          BASE: ${{ steps.pages.outputs.base_url || 'https://bolsillo.bendi.dev' }}
        run: |
          mkdir -p data
          for f in luz generacion gasolina gasolina-historico euribor ipc compra alquiler ahorro; do
            curl -fsSL --max-time 60 "$BASE/data/$f.json" -o "data/$f.json" || rm -f "data/$f.json"
          done
          ls -la data

      - name: Descargar datos (REE, Ministerio, Banco de España e INE)
        run: npm run datos

      - name: Códigos postales (GeoNames, CC BY 4.0)
        run: |
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/ES.zip" https://download.geonames.org/export/zip/ES.zip \
            && unzip -p "$RUNNER_TEMP/ES.zip" ES.txt > "$RUNNER_TEMP/ES.txt" || true
          node scripts/fetch-cp.mjs "$RUNNER_TEMP/ES.txt"

      - name: Instalar herramientas (fuente, mapa, navegador de pruebas)
        run: |
          npm run herramientas
          npx playwright install --with-deps chromium

      - name: Fuente y mapa servidos desde la web
        # Si falla, la web sigue funcionando con la fuente del sistema y sin mapa.
        continue-on-error: true
        run: node scripts/vendor.mjs

      - name: Iconos e imagen para compartir
        run: node scripts/imagenes.mjs

      - name: Preparar la web
        run: |
          mkdir -p _site vendor
          cp -r index.html luz gasolina compra alquiler hipoteca ahorro ipc fuentes assets data vendor \
            manifest.webmanifest sw.js sitemap.xml robots.txt .nojekyll _site/
          # Versión en inglés en /en/ (falla si queda texto sin traducir)
          node scripts/ingles.mjs
          # Versión en los estilos y scripts de cada página: al publicar, nadie ve HTML nuevo con CSS viejo
          v="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i -E "s#(href=\"[^\"]+\.css)\"#\1?v=$v\"#g; s#(src=\"[^\"]+\.js)\"#\1?v=$v\"#g" {} +

      - name: Estado de las fuentes
        if: always()
        run: |
          node -e "const e=require('./data/estado.json');for(const[k,v]of Object.entries(e))console.log((v.ok?'::notice::':'::warning::')+k+': '+v.detalle)" || true

      - name: Tests de navegador y accesibilidad
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log" || {
            # Los fallos salen como anotaciones en la PR, para verlos sin abrir el registro
            grep -E "^not ok|AssertionError|Error:|expected|actual|message:|^\s+[+-] " "$RUNNER_TEMP/e2e.log" | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Lighthouse (rendimiento, accesibilidad, buenas prácticas y SEO)
        run: |
          set -o pipefail
          npm run lighthouse 2>&1 | tee "$RUNNER_TEMP/lh.log" || {
            grep -E "mínimo|Error" "$RUNNER_TEMP/lh.log" | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Capturas para el README
        # Si fallan no pasa nada: el README seguirá enseñando las anteriores
        continue-on-error: true
        run: npm run capturas

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Subir el estado de las fuentes para el aviso
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estado
          path: data/estado.json
          if-no-files-found: ignore

  publicar:
    # En las PR solo se construye y se prueba; se publica desde main
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  avisar:
    # Abre un issue si falla alguna fuente de datos, los tests o la publicación, y lo cierra al recuperarse
    if: always() && github.event_name != 'pull_request'
    needs: [construir, publicar]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: estado

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULTADO_CONSTRUIR: ${{ needs.construir.result }}
          RESULTADO_PUBLICAR: ${{ needs.publicar.result }}
        with:
          script: |
            const fs = require('fs');
            let estado = {};
            try { estado = JSON.parse(fs.readFileSync('estado.json', 'utf8')); } catch {}
            const fallos = Object.entries(estado).filter(([, e]) => !e.ok).map(([f, e]) => `- **${f}**: ${e.detalle}`);
            if (process.env.RESULTADO_CONSTRUIR !== 'success') fallos.push('- **construcción o tests**: la web no se ha podido preparar o no ha pasado los tests');
            else if (process.env.RESULTADO_PUBLICAR !== 'success') fallos.push('- **publicación**: GitHub Pages no ha aceptado la nueva versión');

            const { owner, repo } = context.repo;
            const abiertos = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'datos' })).data;
            const ejecucion = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (fallos.length) {
              const cuerpo = `${fallos.join('\n')}\n\n[Ver ejecución](${ejecucion})`;
              if (abiertos.length) {
                await github.rest.issues.createComment({ owner, repo, issue_number: abiertos[0].number, body: `Sigue fallando:\n\n${cuerpo}` });
              } else {
                await github.rest.issues.create({ owner, repo, title: 'Fallo al actualizar la web', labels: ['datos'], body: `La web sigue con la última versión buena.\n\n${cuerpo}` });
              }
              core.warning(fallos.join(' | '));
            } else {
              for (const i of abiertos) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `Resuelto: todo vuelve a funcionar. [Ver ejecución](${ejecucion})` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
            }
